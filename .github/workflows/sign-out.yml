name: 签退

on:
  workflow_dispatch:
  schedule:
    # UTC 时间，中国时区减 8
    # 北京时间 16:30 = UTC 08:30
    - cron: '30 8 * * *'

jobs:
  run-check-out:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          
      - name: 安装依赖  
        run: |
          npm install

      - name: 运行签退
        run: |
          node ./index.js '${{ secrets.XYB_OUT }}'
